name: NeoCam documentation

on:
  pull_request:
  push:
    branches: ['**']
    paths:
      - 'docs/**'
      - 'README.md'
      - 'packages.yml'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: python -m sphinx -b html -n -W --keep-going docs _build/docs/html
      - uses: actions/upload-artifact@v4
        with:
          name: neocam-docs-html
          path: _build/docs/html
          if-no-files-found: error
          retention-days: 7
