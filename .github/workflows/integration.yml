name: NeoCam integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Optional package to override, for example WifiStack
        required: false
        type: string
      package_ref:
        description: Branch, tag or commit of that package; supply both inputs or neither
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration:
    uses: NeoTech-vietnam/ci-workflows/.github/workflows/esp-idf.yml@v1.0.0
    with:
      idf-version: v6.0.1
      target: esp32s3
      package: ${{ inputs.package || '' }}
      package-ref: ${{ inputs.package_ref || '' }}
    secrets:
      PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
